# Local Supabase stack (npx supabase start). Only Postgres, the API, and Studio
# are needed; the app talks to Postgres directly.
project_id = "mcount"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = false
