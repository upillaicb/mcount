<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9;
      min-height: 100vh; padding: clamp(1rem, 3vw, 3rem); overflow: hidden; }

    .timer {
      position: fixed; top: clamp(.5rem, 2vw, 2rem); right: clamp(1rem, 3vw, 3rem);
      font-size: clamp(2.5rem, 9vw, 10rem); font-weight: 800;
      color: #38bdf8; font-variant-numeric: tabular-nums; line-height: 1;
    }
    .timer.low { color: #f87171; animation: pulse .5s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.15); } }

    .meta {
      position: fixed; top: clamp(.75rem, 2vw, 2rem); left: clamp(1rem, 3vw, 3rem);
      color: #94a3b8; font-size: clamp(1rem, 2vw, 2rem);
    }

    .stage { height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 0 clamp(1rem, 5vw, 6rem); }

    .label {
      color: #94a3b8; letter-spacing: .25em; text-transform: uppercase;
      font-size: clamp(.9rem, 1.6vw, 1.8rem); margin-bottom: clamp(1rem, 2vw, 2rem);
    }
    .content {
      font-size: clamp(2rem, 6vw, 7rem); font-weight: 600; line-height: 1.25;
      max-width: 90vw; white-space: pre-wrap;
    }
    .answer .content { color: #4ade80; }

    .btn {
      padding: clamp(.75rem, 1.5vw, 1.5rem) clamp(1.5rem, 3vw, 3rem);
      font-size: clamp(1.1rem, 2.2vw, 2.4rem);
      border-radius: 12px; border: 0; cursor: pointer; font-weight: bold;
    }
    .start-btn { background: #38bdf8; color: #0f172a; }

    .pause-btn {
      position: fixed; left: clamp(1rem, 2.5vw, 2.5rem); bottom: clamp(1rem, 2.5vw, 2.5rem);
      background: rgba(148, 163, 184, .18); color: #f1f5f9;
      backdrop-filter: blur(4px);
    }
    .pause-btn:hover { background: rgba(148, 163, 184, .32); }

    .paused-badge {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(3rem, 10vw, 12rem); font-weight: 900; color: #fbbf24;
      letter-spacing: .1em; pointer-events: none; opacity: .85;
    }

    .leaderboard {
      position: fixed; right: clamp(1rem, 2.5vw, 2.5rem); bottom: clamp(1rem, 2.5vw, 2.5rem);
      background: rgba(15, 23, 42, .7); border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 12px; padding: clamp(.5rem, 1vw, 1rem) clamp(.8rem, 1.5vw, 1.5rem);
      backdrop-filter: blur(4px); min-width: clamp(180px, 22vw, 340px); max-height: 45vh;
      overflow: hidden; font-size: clamp(.9rem, 1.4vw, 1.6rem);
    }
    .leaderboard h4 {
      margin: 0 0 .4rem; font-size: clamp(.8rem, 1.2vw, 1.2rem);
      color: #94a3b8; letter-spacing: .2em; text-transform: uppercase; font-weight: 600;
    }
    .leaderboard ol { list-style: none; padding: 0; margin: 0; }
    .leaderboard li { display: flex; justify-content: space-between; gap: 1rem;
      padding: .2rem 0; border-bottom: 1px solid rgba(148, 163, 184, .1); }
    .leaderboard li:last-child { border-bottom: 0; }
    .leaderboard .score { font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .leaderboard li.top .score { color: #fbbf24; }

    #confetti {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
    }
    .celebrate .content {
      background: linear-gradient(90deg, #fbbf24, #f472b6, #38bdf8, #4ade80, #fbbf24);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 3s linear infinite;
      background-size: 200% 100%;
    }
    @keyframes shine { to { background-position: -200% 0; } }
    .winner-name { font-size: clamp(2.5rem, 8vw, 9rem); font-weight: 900; }
    .winner-sub { font-size: clamp(1.2rem, 2.5vw, 2.5rem); color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div id="meta" class="meta"></div>
  <div id="timer" class="timer"></div>
  <div id="stage" class="stage">
    <div class="label" id="label"></div>
    <div class="content" id="content">Loading…</div>
    <div id="ctrlWrap" style="margin-top: clamp(1.5rem, 3vw, 3rem);"></div>
  </div>
  <button id="pauseBtn" class="btn pause-btn" style="display:none" onclick="togglePause()">⏸ Pause</button>
  <div id="pausedBadge" class="paused-badge" style="display:none">PAUSED</div>
  <div id="leaderboard" class="leaderboard" style="display:none">
    <h4>Scores</h4>
    <ol id="lbList"></ol>
  </div>

  <script>
    const quizId = location.pathname.split('/').pop();
    let state = null;
    let audioCtx = null;
    let audioReady = false;
    let lastBeepSec = -1;

    let localStart = null;
    let pausedAt = null;
    let pausedOffsetMs = 0;
    let celebrated = false;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioReady = true;
    }

    function beep(freq = 880, duration = 0.18) {
      if (!audioReady) return;
      try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        o.connect(g).connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playFanfare() {
      if (!audioReady) return;
      const now = audioCtx.currentTime;
      // Triumphant sequence: C major arpeggios rising, then held chord.
      const notes = [
        [523.25, 0.00, 0.15], [659.25, 0.15, 0.15], [783.99, 0.30, 0.15], [1046.5, 0.45, 0.35],
        [698.46, 0.85, 0.15], [880.00, 1.00, 0.15], [1046.5, 1.15, 0.15], [1318.5, 1.30, 0.35],
        [1046.5, 1.75, 0.9], [1318.5, 1.75, 0.9], [1567.98, 1.75, 0.9]
      ];
      for (const [f, t, d] of notes) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + t);
        g.gain.exponentialRampToValueAtTime(0.25, now + t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
        o.connect(g).connect(audioCtx.destination);
        o.start(now + t); o.stop(now + t + d + 0.05);
      }
    }

    // ---------- Confetti ----------
    const confettiCanvas = document.getElementById('confetti');
    const cctx = confettiCanvas.getContext('2d');
    let confettiPieces = [];
    let confettiRunning = false;

    function sizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', sizeConfetti);
    sizeConfetti();

    function launchConfetti() {
      const colors = ['#fbbf24', '#f472b6', '#38bdf8', '#4ade80', '#f87171', '#a78bfa'];
      for (let i = 0; i < 220; i++) {
        confettiPieces.push({
          x: Math.random() * confettiCanvas.width,
          y: -20 - Math.random() * confettiCanvas.height * 0.5,
          w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 3,
          vy: 2 + Math.random() * 4,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(animConfetti); }
    }

    function animConfetti() {
      cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (const p of confettiPieces) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.02;
        cctx.save();
        cctx.translate(p.x, p.y); cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      }
      confettiPieces = confettiPieces.filter(p => p.y < confettiCanvas.height + 30);
      if (confettiPieces.length) requestAnimationFrame(animConfetti);
      else { confettiRunning = false; cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }
    }

    function celebrate(winners, score) {
      if (celebrated) return;
      celebrated = true;
      const contentEl = document.getElementById('content');
      const labelEl = document.getElementById('label');
      const stage = document.getElementById('stage');
      stage.classList.add('celebrate');
      const isTie = winners.length > 1;
      const names = winners.map(w => escapeHtml(w.name)).join(' &amp; ');
      labelEl.textContent = isTie ? '🎉 It\'s a tie! 🎉' : '🎉 Winner 🎉';
      contentEl.innerHTML =
        `<div class="winner-name">${names}</div>` +
        `<div class="winner-sub">${score} point${score === 1 ? '' : 's'}${isTie ? ' — shared victory!' : ''}</div>`;
      launchConfetti();
      playFanfare();
      // second burst
      setTimeout(launchConfetti, 1500);
      setTimeout(launchConfetti, 3200);
    }

    async function poll() {
      try {
        const r = await fetch('/api/current/' + quizId);
        if (r.ok) state = await r.json();
        else state = { notFound: true };
      } catch (e) {}
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const box = document.getElementById('leaderboard');
      const list = document.getElementById('lbList');
      const ps = (state && state.participants) || [];
      if (!ps.length) { box.style.display = 'none'; return; }
      box.style.display = '';
      list.innerHTML = '';
      ps.forEach((p, i) => {
        const li = document.createElement('li');
        if (i === 0) li.className = 'top';
        li.innerHTML = `<span>${i + 1}. ${escapeHtml(p.name)}</span><span class="score">${p.score}</span>`;
        list.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function startQuiz() {
      ensureAudio();
      localStart = Date.now();
      pausedAt = null;
      pausedOffsetMs = 0;
      celebrated = false;
      document.getElementById('stage').classList.remove('celebrate');
      document.getElementById('ctrlWrap').innerHTML = '';
      const pb = document.getElementById('pauseBtn');
      pb.style.display = '';
      pb.textContent = '⏸ Pause';
    }

    function togglePause() {
      const btn = document.getElementById('pauseBtn');
      const badge = document.getElementById('pausedBadge');
      if (pausedAt === null) {
        pausedAt = Date.now();
        btn.textContent = '▶ Resume';
        badge.style.display = '';
      } else {
        pausedOffsetMs += Date.now() - pausedAt;
        pausedAt = null;
        btn.textContent = '⏸ Pause';
        badge.style.display = 'none';
      }
    }

    function elapsedSec() {
      const nowRef = pausedAt !== null ? pausedAt : Date.now();
      return (nowRef - localStart - pausedOffsetMs) / 1000;
    }

    function render() {
      const contentEl = document.getElementById('content');
      const labelEl = document.getElementById('label');
      const timerEl = document.getElementById('timer');
      const metaEl = document.getElementById('meta');
      const stage = document.getElementById('stage');
      const ctrlWrap = document.getElementById('ctrlWrap');
      const pauseBtn = document.getElementById('pauseBtn');

      if (!state) return;
      if (state.notFound) {
        labelEl.textContent = ''; contentEl.textContent = 'Quiz not found.';
        timerEl.textContent = ''; metaEl.textContent = '';
        ctrlWrap.innerHTML = ''; pauseBtn.style.display = 'none';
        return;
      }
      if (!state.published || !state.questions.length) {
        labelEl.textContent = '';
        contentEl.textContent = 'Waiting for quiz to start…';
        timerEl.textContent = '';
        metaEl.textContent = state.name || '';
        stage.classList.remove('answer');
        ctrlWrap.innerHTML = ''; pauseBtn.style.display = 'none';
        localStart = null;
        return;
      }

      if (localStart === null) {
        labelEl.textContent = 'Ready';
        contentEl.textContent = `${state.name} · ${state.questions.length} question(s)`;
        timerEl.textContent = ''; metaEl.textContent = '';
        stage.classList.remove('answer');
        pauseBtn.style.display = 'none';
        if (!ctrlWrap.querySelector('button')) {
          ctrlWrap.innerHTML = '<button class="btn start-btn" id="startBtn">▶ Start Quiz</button>';
          document.getElementById('startBtn').onclick = startQuiz;
        }
        return;
      }

      const dur = state.durationSeconds;
      const ans = state.answerSeconds;
      const slot = dur + ans;
      const elapsed = elapsedSec();
      if (elapsed < 0) return;
      const idx = Math.floor(elapsed / slot);
      if (idx >= state.questions.length) {
        const ps = (state.participants || []).slice().sort((a, b) => b.score - a.score);
        pauseBtn.style.display = 'none';
        timerEl.textContent = ''; metaEl.textContent = state.name || '';
        if (ps.length && ps[0].score > 0) {
          const top = ps[0].score;
          const winners = ps.filter(p => p.score === top);
          celebrate(winners, top);
        } else {
          labelEl.textContent = '';
          contentEl.textContent = 'Quiz complete.';
          stage.classList.remove('answer');
        }
        return;
      }
      const inSlot = elapsed - idx * slot;
      const q = state.questions[idx];
      metaEl.textContent = `${state.name} · ${idx + 1} / ${state.questions.length}`;

      if (inSlot < dur) {
        const remaining = Math.ceil(dur - inSlot);
        labelEl.textContent = 'Question';
        contentEl.textContent = q.text;
        stage.classList.remove('answer');
        timerEl.textContent = remaining;
        timerEl.classList.toggle('low', remaining <= 5);
        if (pausedAt === null && remaining <= 5 && remaining >= 1 && remaining !== lastBeepSec) {
          lastBeepSec = remaining;
          beep(remaining === 1 ? 1200 : 880, 0.18);
        }
        if (remaining > 5) lastBeepSec = -1;
      } else {
        const remaining = Math.ceil(slot - inSlot);
        labelEl.textContent = 'Answer';
        contentEl.textContent = q.answer || '(no answer provided)';
        stage.classList.add('answer');
        timerEl.textContent = remaining;
        timerEl.classList.remove('low');
        lastBeepSec = -1;
      }
    }

    poll();
    setInterval(poll, 2000);
    setInterval(render, 100);
  </script>
</body>
</html>
